plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'  // 수정됨
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 테스트 의존성도 수정
	testImplementation 'org.springframework.boot:spring-boot-starter-test'  // 수정됨
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.2.1'
}

tasks.named('test') {
	useJUnitPlatform()
}